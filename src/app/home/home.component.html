<div class="fb-background"></div>
<div class="fb-container home-grid" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;">
  <h1 class="logo">FUSIÓN DE MUNDOS</h1>
  <h2 class="subtitle">Elige tu juego y explora nuevas galaxias</h2>
  <div style="position: absolute; top: 24px; right: 24px; z-index: 1000;">
    <audio id="home-audio" src="/music/register.mp3"autoplay loop></audio>
    <div style="display: flex; gap: 10px; margin-top: 8px;">
      <button class="btn-volumen-3d" style="box-shadow: 0 4px 16px #4caf50bb; border-radius: 16px; background: linear-gradient(135deg, #e0ffe0 0%, #4caf50 100%); color: #1b3c1b; font-weight: 700; font-size: 1.2rem; padding: 10px 24px; margin-bottom: 4px;" onclick="document.getElementById('home-audio').volume=Math.min(document.getElementById('home-audio').volume+0.1,1)">🔊 +</button>
      <button class="btn-volumen-3d" style="box-shadow: 0 4px 16px #4caf50bb; border-radius: 16px; background: linear-gradient(135deg, #e0ffe0 0%, #4caf50 100%); color: #1b3c1b; font-weight: 700; font-size: 1.2rem; padding: 10px 24px; margin-bottom: 4px;" onclick="document.getElementById('home-audio').volume=Math.max(document.getElementById('home-audio').volume-0.1,0)">🔉 -</button>
      <button class="btn-volumen-3d" style="box-shadow: 0 4px 16px #4caf50bb; border-radius: 16px; background: linear-gradient(135deg, #e0ffe0 0%, #4caf50 100%); color: #1b3c1b; font-weight: 700; font-size: 1.2rem; padding: 10px 24px; margin-bottom: 4px;" onclick="document.getElementById('home-audio').muted=true">🔇</button>
      <button class="btn-volumen-3d" style="box-shadow: 0 4px 16px #4caf50bb; border-radius: 16px; background: linear-gradient(135deg, #e0ffe0 0%, #4caf50 100%); color: #1b3c1b; font-weight: 700; font-size: 1.2rem; padding: 10px 24px; margin-bottom: 4px;" onclick="document.getElementById('home-audio').muted=false">🔈</button>
    </div>
  </div>
  <div class="card-container" style="display: flex; justify-content: center; align-items: center; margin-top: 32px;">
    <div *ngFor="let juego of juegos" class="game-card" style="margin: 0 18px;">
      <img class="game-image" [src]="juego.imagen" [alt]="juego.nombre" />
      <h3 class="game-title">{{ juego.nombre }}</h3>
      <button class="game-button" (click)="iniciarJuego(juego.nombre)">Iniciar</button>
    </div>
  </div>

  <ng-container *ngIf="mostrarMario">
    <ng-container *ngIf="mostrarMario" [ngTemplateOutlet]="marioTemplate"></ng-container>
    <ng-template #marioTemplate>
      <div id="mario-infinito-container" style="display: flex; flex-direction: column; align-items: center; margin-top: 32px;">
        <canvas id="gameCanvas" width="900" height="500" style="border: 4px solid #333; background: #b3e5fc; box-shadow: 0 8px 32px #1976d2bb; border-radius: 18px;"></canvas>
        <div style="display: flex; gap: 24px; margin-top: 12px;">
          <span id="score" style="font-size: 1.3rem; font-weight: bold; color: #1976d2;">0</span>
          <span id="lives" style="font-size: 1.3rem; font-weight: bold; color: #388e3c;">3</span>
          <span id="level" style="font-size: 1.3rem; font-weight: bold; color: #fbc02d;">1</span>
          <span id="distance" style="font-size: 1.3rem; font-weight: bold; color: #6d4c41;">Distancia: 0m</span>
        </div>
        <div id="gameOver" style="display:none; margin-top: 24px; background: #fff3e0; border-radius: 12px; padding: 24px 36px; box-shadow: 0 4px 16px #ff9800bb; text-align: center;">
          <h2 style="color: #d32f2f;">¡Game Over!</h2>
          <p>Puntaje final: <span id="finalScore">0</span></p>
          <button onclick="window.restartGame()" style="background: #1976d2; color: white; border: none; border-radius: 8px; padding: 10px 24px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">Reintentar</button>
        </div>
      </div>
    </ng-template>
  </ng-container>
</div>
